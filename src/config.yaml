site:
  # TODO(swap-before-deploy): set to the real GitHub Pages URL, e.g.
  # https://<github-username>.github.io/<repo-name>
  name: Aurora Del Pino Gallardo
  site: 'https://aurora-del-pino.github.io/portfolio'
  # GitHub Pages serves a project site from a sub-path. For a user site
  # (https://<user>.github.io) set this to '/'.
  base: '/portfolio'
  trailingSlash: false

  googleSiteVerificationId: ''

metadata:
  title:
    default: 'Aurora Del Pino Gallardo — Product Designer'
    template: '%s — Aurora Del Pino Gallardo'
  description: >-
    Product designer in Málaga, Spain. I design healthcare and SaaS interfaces
    after a decade of owning the growth side of the funnel — so I know what
    happens after the click.
  robots:
    index: true
    follow: true
  openGraph:
    site_name: 'Aurora Del Pino Gallardo'
    images:
      - url: '~/assets/images/og.png'
        width: 1200
        height: 630
    type: website
  twitter:
    handle: ''
    site: ''
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    postsPerPage: 8
    post:
      isEnabled: false
